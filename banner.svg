<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title">
<title id="title">Dante Yupanqui | Full Stack Developer · Backend, IA y automatización</title>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 50% { transform: translateY(-7px); } }
@keyframes breathe { 50% { opacity: .45; } }
@keyframes blink { 50% { opacity: 0; } }
.orbit { transform-origin: 957px 227px; animation: spin 28s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 19s; }
.float { animation: float 6s ease-in-out infinite; }.delay { animation-delay: -3s; }
.glow, .core { animation: breathe 7s ease-in-out infinite; }
.cursor { animation: blink 1.2s steps(1) infinite; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

